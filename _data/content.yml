### Resume [ resume ]
resume:
  title: "이력서"
  subtitle: "학력 및<b>경력</b>"
  bg_title: "History"

  education:
    title: "학력"
    items:
      - name: "한국폴리텍대학 강서캠퍼스"
        subname: "사이버보안과"
        period: "2025 - <b>재학중</b>"
        text: "네트워크 보안, 시스템 보안, 데이터 베이스 기초 지식 등 사이버 보안의 기초 지식을 배우고 있습니다."

      - name: "운전면허 1종 보통"
        subname: "한국도로교통공단"
        period: "2021-12"
        text: "한국의 운전면허를 취득하였습니다."

      - name: "공동주택 IT 안전관리사 2급"
        subname: "한국 홈네트워크 안전관리협회"
        period: "2025-09-23"
        text: "공동주택의 IT 시스템에 대한 안전관리에 관한 자격증을 취득하였습니다."

      - name: "네트워크 관리사 2급"
        subname: "한국정보통신자격협회"
        period: "2025-12-09"
        text: "네트워크 시스템의 운영 및 관리에 관한 자격증을 취득하였습니다."

      - name: "리눅스 마스터 2급"
        subname: "한국정보통신진흥협회"
        period: "2025-12-13"
        text: "리눅스 시스템의 운영 및 관리에 관한 자격증을 취득하였습니다."

  experience:
    title: "Experience"
    items:
      - name: "융합프로젝트 PM"
        subname: "한국폴리텍대학 강서캠퍼스"
        period: "2026.03 - 2026.06"
        text: "랜섬웨어의 VSS스냅샷 삭제 공격을 방지하고 사용자의 데이터를 실시간으로 안전하게 보호하는 고성능 방어엔진(LIRS) 개발."

      - name: "동아리 <White RootKit>"
        subname: "보안 스터디 & 프로젝트"
        period: "2026.01 - 2026.12"
        text: "iptables/Snort/IDS/IPS를 활용한 LLM 자동화 프로젝트 진행 및 VPN구현, 방학 보안 스터디 참여."

      - name: "동계학술대회 논문 발표"
        subname: "한국컴퓨터정보학회"
        period: "2025.09 - 2025.12"
        text: "AI를 이용한 산불 감지 및 예방 시스템 2026년 한국컴퓨터정보학회 동계학술대회 논문집 제 34권 1호 등재."

      - name: "춘계 종합학술대회 논문 발표"
        subname: "한국정보통신학회 2026년 춘계"
        period: "2026.04 - 2026.05"
        text: "WannaCry 랜섬웨어 : EternalBlue 취약점 분석 및 방어 전략 2026년 한국정보통신학회 춘계 종합학술대회 논문집 춘계 30권 1호 등재."

      - name: "2학년 과대표"
        subname: "한국폴리텍대학 강서캠퍼스"
        period: "2026.03 - 2026.12"
        text: "학과 학생 대표로 학사 일정 관리 및 교수와 학생 간 가교 역할을 담당했습니다."


